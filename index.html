<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Posture Monitor - Debug Mode</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #202024;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 4px solid #323238;
        }
        .status-good { border-color: #04d361; }
        .status-bad { border-color: #f75151; }
        
        h1 { margin-top: 0; color: #ffffff; }
        
        .control-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        select {
            background-color: #121214;
            color: #e1e1e6;
            border: 2px solid #323238;
            padding: 10px;
            border-radius: 6px;
            width: 80%;
            font-size: 14px;
        }

        button {
            background-color: #4e44e7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 80%;
        }
        
        #canvas-container {
            margin: 15px auto;
            border-radius: 8px;
            overflow: hidden;
            width: 300px;
            height: 300px;
            background-color: #121214;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #323238;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        #status-message {
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="container" id="main-card">
    <h1>Monitor de Postura - Diagnóstico</h1>
    
    <div class="control-group">
        <label for="camera-select">Dispositivo de Video:</label>
        <select id="camera-select"><option>Cargando origen...</option></select>
        <button type="button" id="start-btn" onclick="init()">Iniciar Monitor</button>
    </div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
    <div id="status-message">Esperando interacción...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/CF29Dd5wY/";

    let model, webcam, ctx, maxPredictions;
    let isRunning = false;

    // Captura global de errores críticos de carga de librerías o scripts
    window.onerror = function(message, source, lineno, colno, error) {
        const msgBox = document.getElementById("status-message");
        msgBox.innerText = "CRITICAL ERR: " + message + " (Línea " + lineno + ")";
        msgBox.style.color = "#f75151";
        return false;
    };

    window.addEventListener('unhandledrejection', function (event) {
        const msgBox = document.getElementById("status-message");
        msgBox.innerText = "PROMISE REJECTION: " + (event.reason?.message || event.reason);
        msgBox.style.color = "#f75151";
    });

    window.onload = async () => {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            const select = document.getElementById("camera-select");
            select.innerHTML = "";
            
            if(videoDevices.length === 0) {
                select.innerHTML = "<option>No se detectan cámaras</option>";
                return;
            }

            videoDevices.forEach((device, index) => {
                const option = document.createElement("option");
                option.value = device.deviceId;
                option.text = device.label || `Cámara ${index + 1}`;
                select.appendChild(option);
            });
        } catch (err) {
            document.getElementById("status-message").innerText = "Error enumerando hardware: " + err.message;
        }
    };

    async function init() {
        if (isRunning) return;
        
        const statusMsg = document.getElementById("status-message");
        statusMsg.innerText = "Cargando modelo de Google...";
        statusMsg.style.color = "#e1e1e6";

        try {
            model = await tmPose.load(URL + "model.json", URL + "metadata.json");
            maxPredictions = model.getTotalClasses();

            statusMsg.innerText = "Iniciando componente Webcam...";
            
            webcam = new tmPose.Webcam(300, 300, true);
            
            // Forzar configuración con ID seleccionado
            const selectedId = document.getElementById("camera-select").value;
            const constraints = selectedId ? { deviceId: { exact: selectedId } } : {};
            
            await webcam.setup({ video: constraints });
            await webcam.play();
            
            const canvas = document.getElementById("canvas");
            canvas.width = 300; 
            canvas.height = 300;
            ctx = canvas.getContext("2d");

            isRunning = true;
            statusMsg.innerText = "Modelo activo. Ejecutando iteración...";
            window.requestAnimationFrame(loop);
        } catch (error) {
            statusMsg.innerText = "FALLO EN INIT: " + error.message;
            statusMsg.style.color = "#f75151";
        }
    }

    async function loop(timestamp) {
        if (!isRunning) return;
        webcam.update(); 
        await predict();
        if (isRunning) window.requestAnimationFrame(loop);
    }

    async function predict() {
        try {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            
            const card = document.getElementById("main-card");
            const message = document.getElementById("status-message");

            if (!pose) {
                ctx.drawImage(webcam.canvas, 0, 0);
                message.innerText = "Buscando silueta corporal...";
                return;
            }

            ctx.drawImage(webcam.canvas, 0, 0);
            tmPose.drawKeypoints(pose.keypoints, 0.5, ctx);
            tmPose.drawSkeleton(pose.keypoints, 0.5, ctx);

            const prediction = await model.predict(posenetOutput);
            let highestClass = "";
            let highestProbability = 0;

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProbability) {
                    highestProbability = prediction[i].probability;
                    highestClass = prediction[i].className;
                }
            }

            if (highestClass === "Good Posture" || highestClass === "Buena Postura") {
                card.className = "container status-good";
                message.innerText = "Postura Correcta (" + Math.round(highestProbability * 100) + "%)";
                message.style.color = "#04d361";
            } else {
                card.className = "container status-bad";
                message.innerText = "Postura Incorrecta (" + Math.round(highestProbability * 100) + "%)";
                message.style.color = "#f75151";
            }
        } catch (err) {
            isRunning = false; // Detener bucle ante fallo
            const message = document.getElementById("status-message");
            message.innerText = "FALLO EN INFERENCIA (PREDICT): " + err.message;
            message.style.color = "#f75151";
        }
    }
</script>
</body>
</html>
