<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Posture Monitor Pro - Edición Universal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #202024;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            transition: border 0.3s ease;
            border: 4px solid #323238;
        }
        /* Estados de borde para retroalimentación visual rápida */
        .status-good { border-color: #04d361; box-shadow: 0 0 15px rgba(4, 211, 97, 0.4); }
        .status-bad { border-color: #f75151; animation: blink 1s infinite; }
        
        h1 { margin-top: 0; color: #ffffff; font-size: 28px; }
        p { color: #7c7c8a; margin-bottom: 25px; }
        
        .control-group {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        label { font-weight: bold; color: #e1e1e6; }

        select {
            background-color: #121214;
            color: #e1e1e6;
            border: 2px solid #323238;
            padding: 12px;
            border-radius: 8px;
            width: 90%;
            font-size: 15px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus { border-color: #4e44e7; }

        button {
            background-color: #4e44e7;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 90%;
            box-shadow: 0 4px 12px rgba(78, 68, 231, 0.3);
        }
        button:hover { background-color: #3b33b3; }
        button:active { transform: translateY(1px); }
        button:disabled {
            background-color: #323238;
            color: #7c7c8a;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        #canvas-container {
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden;
            width: 300px;
            height: 300px;
            background-color: #121214;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #323238;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Eliminamos cualquier filtro de espejo aquí, lo manejaremos en JS si es necesario */
        }
        
        #status-message {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Animación sutil de parpadeo para alerta de mala postura */
        @keyframes blink {
            0% { box-shadow: 0 0 10px rgba(247, 81, 81, 0.5); border-color: #f75151; }
            50% { box-shadow: 0 0 25px rgba(247, 81, 81, 0.9); border-color: #ff8787; }
            100% { box-shadow: 0 0 10px rgba(247, 81, 81, 0.5); border-color: #f75151; }
        }
    </style>
</head>
<body>

<div class="container" id="main-card">
    <h1>Monitor de Postura Inteligente</h1>
    <p>Análisis de geometría corporal adaptable a cualquier entorno laboral.</p>
    
    <div class="control-group">
        <label for="camera-select">Seleccionar Dispositivo de Video:</label>
        <select id="camera-select"><option>Cargando hardware...</option></select>
        <button type="button" id="start-btn" onclick="init()">Iniciar Monitor Pro</button>
    </div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
    <div id="status-message">Esperando inicio...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/CF29Dd5wY/";

    let model, webcam, ctx, maxPredictions;
    let isRunning = false;

    // Ejecución automática al cargar la página: Detecta hardware de video de forma nativa
    window.onload = async () => {
        try {
            // Solicita una ráfaga rápida de acceso para forzar al S.O. a revelar los nombres de las cámaras
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(track => track.stop()); // Apaga de inmediato para liberar hardware
            
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            const select = document.getElementById("camera-select");
            select.innerHTML = "";
            
            if(videoDevices.length === 0) {
                select.innerHTML = "<option>No se encontraron cámaras físicas</option>";
                return;
            }

            videoDevices.forEach((device, index) => {
                const option = document.createElement("option");
                option.value = device.deviceId;
                option.text = device.label || `Cámara Integrada ${index + 1}`;
                select.appendChild(option);
            });
        } catch (err) {
            console.error("Error enumerando periféricos:", err);
            document.getElementById("camera-select").innerHTML = "<option>Permiso de cámara denegado</option>";
        }
    };

    async function init() {
        if (isRunning) return;
        
        const statusMsg = document.getElementById("status-message");
        const startBtn = document.getElementById("start-btn");
        const cameraSelect = document.getElementById("camera-select");
        
        startBtn.disabled = true;
        cameraSelect.disabled = true;
        statusMsg.innerText = "Cargando IA...";
        statusMsg.style.color = "#e1e1e6";

        try {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmPose.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const size = 300;
            const flip = true; // Mantener efecto espejo para UX natural
            webcam = new tmPose.Webcam(size, size, flip);
            
            // Restricción por software: Forzar el ID de la cámara seleccionada en el dropdown
            const selectedDeviceId = cameraSelect.value;
            const constraints = selectedDeviceId ? { video: { deviceId: { exact: selectedDeviceId } } } : { video: true };
            
            statusMsg.innerText = "Sincronizando cámara...";
            await webcam.setup({ video: constraints }); 
            await webcam.play();
            
            const canvas = document.getElementById("canvas");
            canvas.width = size; 
            canvas.height = size;
            ctx = canvas.getContext("2d");

            isRunning = true;
            window.requestAnimationFrame(loop);
            statusMsg.innerText = "Analizando postura...";
        } catch (error) {
            console.error(error);
            statusMsg.innerText = "Error: Cámara ocupada o permiso denegado.";
            statusMsg.style.color = "#f75151";
            startBtn.disabled = false;
            cameraSelect.disabled = false;
            isRunning = false;
        }
    }

    async function loop(timestamp) {
        if (!isRunning) return;
        webcam.update(); 
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        // Validación de Seguridad: Si la cámara no envía frames válidos, frena la ejecución
        if (!webcam.canvas || webcam.canvas.width === 0) return;

        try {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            
            const card = document.getElementById("main-card");
            const message = document.getElementById("status-message");

            // --- SOLUCIÓN AL PROBLEMA 1 ---
            // 1. PRIMERO: Dibujamos el video de la cámara SIEMPRE
            ctx.drawImage(webcam.canvas, 0, 0);

            // 2. SEGUNDO: Comentamos/Eliminamos las líneas de dibujo del esqueleto (puntos y líneas cian)
            // Estas líneas son las que causaban la visualización de los puntos de medición.
            // tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
            // tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
            // ---------------------------------

            if (!pose) {
                card.className = "container";
                message.innerText = "Buscando silueta...";
                message.style.color = "#7c7c8a";
                return;
            }

            const prediction = await model.predict(posenetOutput);
            let highestClass = "";
            let highestProbability = 0;

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProbability) {
                    highestProbability = prediction[i].probability;
                    highestClass = prediction[i].className;
                }
            }

            // Filtro matemático de estabilidad (Evita falsos cambios bruscos de estado)
            if (highestProbability < 0.75) return; 

            // Manejo adaptativo basado en el nombre exacto de tus clases asignadas en TM
            if (highestClass === "Good Posture" || highestClass === "Buena Postura") {
                card.className = "container status-good";
                message.innerText = "Excelente postura";
                message.style.color = "#04d361";
            } else {
                card.className = "container status-bad";
                message.innerText = "¡Endorézate! Estás encorvado";
                message.style.color = "#f75151";
            }
        } catch (err) {
            console.error("Error en ejecución de inferencia:", err);
        }
    }
</script>
</body>
</html>
