<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Posture Monitor Pro - Edición Universal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #202024;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            transition: border 0.3s ease;
            border: 4px solid #323238;
        }
        .status-good { border-color: #04d361; }
        .status-bad { border-color: #f75151; animation: blink 1s infinite; }
        
        h1 { margin-top: 0; color: #ffffff; }
        
        .control-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        select {
            background-color: #121214;
            color: #e1e1e6;
            border: 2px solid #323238;
            padding: 10px;
            border-radius: 6px;
            width: 80%;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
        select:focus { border-color: #4e44e7; }

        button {
            background-color: #4e44e7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 80%;
        }
        button:hover { background-color: #3b33b3; }
        button:disabled {
            background-color: #323238;
            color: #7c7c8a;
            cursor: not-allowed;
        }
        
        #canvas-container {
            margin: 15px auto;
            border-radius: 8px;
            overflow: hidden;
            width: 300px;
            height: 300px;
            background-color: #121214;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #323238;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #status-message {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            text-transform: uppercase;
        }
        @keyframes blink {
            0% { box-shadow: 0 0 10px rgba(247, 81, 81, 0.5); }
            50% { box-shadow: 0 0 25px rgba(247, 81, 81, 0.9); }
            100% { box-shadow: 0 0 10px rgba(247, 81, 81, 0.5); }
        }
    </style>
</head>
<body>

<div class="container" id="main-card">
    <h1>Monitor de Postura IA Pro</h1>
    <p>Análisis de geometría corporal adaptable a cualquier entorno laboral.</p>
    
    <div class="control-group">
        <label for="camera-select">Seleccionar Dispositivo de Video:</label>
        <select id="camera-select"><option>Detectando cámaras...</option></select>
        <button type="button" id="start-btn" onclick="init()">Iniciar Monitor</button>
    </div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
    <div id="status-message">Esperando inicio...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@latest/dist/teachablemachine-pose.min.js"></script>
<script type="text/javascript">
    
    const URL = "https://teachablemachine.withgoogle.com/models/CF29Dd5wY/";

    let model, webcam, ctx, maxPredictions;
    let isRunning = false;

    window.onload = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(track => track.stop()); 
            
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            const select = document.getElementById("camera-select");
            select.innerHTML = "";
            
            if(videoDevices.length === 0) {
                select.innerHTML = "<option>No se encontraron cámaras físicas</option>";
                return;
            }

            videoDevices.forEach((device, index) => {
                const option = document.createElement("option");
                option.value = device.deviceId;
                option.text = device.label || `Cámara Integrada ${index + 1}`;
                select.appendChild(option);
            });
        } catch (err) {
            console.error(err);
            document.getElementById("camera-select").innerHTML = "<option>Permiso de cámara denegado</option>";
        }
    };

    async function init() {
        if (isRunning) return;
        
        const statusMsg = document.getElementById("status-message");
        const startBtn = document.getElementById("start-btn");
        const cameraSelect = document.getElementById("camera-select");
        
        startBtn.disabled = true;
        cameraSelect.disabled = true;
        statusMsg.innerText = "Cargando Red Neuronal...";
        statusMsg.style.color = "#e1e1e6";

        try {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmPose.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const size = 300;
            const flip = true;
            webcam = new tmPose.Webcam(size, size, flip);
            
            const selectedDeviceId = cameraSelect.value;
            const constraints = selectedDeviceId ? { video: { deviceId: { exact: selectedDeviceId } } } : { video: true };
            
            statusMsg.innerText = "Sincronizando flujo de video...";
            await webcam.setup(constraints); 
            await webcam.play();
            
            const canvas = document.getElementById("canvas");
            canvas.width = size; 
            canvas.height = size;
            ctx = canvas.getContext("2d");

            isRunning = true;
            window.requestAnimationFrame(loop);
            statusMsg.innerText = "Analizando postura...";
        } catch (error) {
            console.error(error);
            statusMsg.innerText = "Error: Enlace de modelo inválido o cámara ocupada.";
            statusMsg.style.color = "#f75151";
            startBtn.disabled = false;
            cameraSelect.disabled = false;
            isRunning = false;
        }
    }

    async function loop(timestamp) {
        if (!isRunning) return;
        webcam.update(); 
        await predict();
        if (isRunning) window.requestAnimationFrame(loop);
    }

    async function predict() {
        if (!webcam.canvas || webcam.canvas.width === 0) return;

        try {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            
            if (!pose) {
                drawPose(null);
                document.getElementById("main-card").className = "container";
                document.getElementById("status-message").innerText = "Buscando silueta...";
                document.getElementById("status-message").style.color = "#7c7c8a";
                return;
            }

            const prediction = await model.predict(posenetOutput);
            let highestClass = "";
            let highestProbability = 0;

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProbability) {
                    highestProbability = prediction[i].probability;
                    highestClass = prediction[i].className;
                }
            }

            const card = document.getElementById("main-card");
            const message = document.getElementById("status-message");

            drawPose(pose);

            if (highestProbability < 0.75) return; 

            if (highestClass === "Good Posture" || highestClass === "Buena Postura") {
                card.className = "container status-good";
                message.innerText = "Excelente postura";
                message.style.color = "#04d361";
            } else {
                card.className = "container status-bad";
                message.innerText = "¡Endorézate! Estás encorvado";
                message.style.color = "#f75151";
            }
        } catch (err) {
            console.error("Error en ejecución de PoseNet:", err);
            isRunning = false;
            const message = document.getElementById("status-message");
            message.innerText = "Error crítico: El modelo de la URL no es de tipo Pose.";
            message.style.color = "#f75151";
        }
    }

    function drawPose(pose) {
        if (webcam.canvas) {
            ctx.drawImage(webcam.canvas, 0, 0);
            if (pose) {
                const minPartConfidence = 0.5;
                tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
            }
        }
    }
</script>
</body>
</html>
